[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "scim2-flask"
version = "0.0.0"
description = "Painless SCIM integration for Flask"
authors = [
    { name = "Éloi Rivard", email = "eloi@yaal.coop" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["scim", "scim2", "provisioning", "flask", "rfc7643", "rfc7644"]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "scim2-models>=0.9.0",
]

[project.urls]
documentation = "https://scim2-flask.readthedocs.io"
repository = "https://github.com/python-scim/scim2-flask"
funding = "https://github.com/sponsors/python-scim"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "prek>=0.5.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "scim2-tester>=0.4.0",
]
doc = [
    "shibuya>=2026.7.12",
    "sphinx>=9.0.4",
    "sphinx-issues>=6.0.0",
    "sphinx-paramlinks>=0.6.0",
    "sphinx-reredirects>=1.1.0",
]

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
]
ignore = [
    "E501", # line-too-long
    "E722", # bare-except
    "D100", # public module
    "D101", # public class
    "D102", # public method
    "D103", # public function
    "D104", # public package
    "D105", # magic method
    "D106", # nested class
    "D107", # public init
    "D203", # no-blank-line-before-class
    "D213", # multi-line-summary-second-line
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
source = ["scim2_flask", "examples", "tests"]

[tool.coverage.report]
exclude_also = [
    'if __name__ == "__main__":',
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--doctest-modules --doctest-glob='*.rst'"
doctest_optionflags= "ALLOW_UNICODE ELLIPSIS"

[tool.uv]
exclude-newer = "14 days"
exclude-newer-package = { scim2-models = false, scim2-client = false, scim2-server = false, scim2-cli = false, scim2-tester = false, pytest-scim2-server = false }
